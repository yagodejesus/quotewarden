[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quotewarden"
version = "0.1.0"
description = "Catch hallucinated quotes, wrong citations and invented numbers in LLM/RAG answers by checking them against the source documents — deterministic, fast and dependency-free."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Yago de Jesus Martins" }]
keywords = ["llm", "rag", "hallucination", "citations", "grounding", "evaluation", "fact checking", "testing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/yagodejesus/quotewarden"
Issues = "https://github.com/yagodejesus/quotewarden/issues"

[project.scripts]
quotewarden = "quotewarden.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quotewarden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905", "E501"]
